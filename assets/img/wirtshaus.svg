      <stop offset="1" stop-color="#ffe3a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="72%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0e08" stop-opacity=".55"/>
