    <path d="M44 8 C60 2 62 -14 52 -20" fill="none" stroke="#8a7a68" stroke-width="9" stroke-linecap="round"/>
    <text x="-18" y="-28" fill="#f4e6c8" font-family="Georgia, serif" font-size="20" opacity=".9">z</text>
