<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="Wirtin Rosalinde im Wirtshaus Zum Schläfrigen Kater">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4a30"/>
      <stop offset=".55" stop-color="#573823"/>
      <stop offset="1" stop-color="#3a2417"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset=".5" stop-color="#a06a3c"/>
      <stop offset="1" stop-color="#7a4a2a"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7d58"/>
      <stop offset="1" stop-color="#3f5a3e"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#ffc766" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#e08a2e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e08a2e" stop-opacity="0"/>
